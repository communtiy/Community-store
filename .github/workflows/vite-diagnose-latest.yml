name: Vite Diagnose Latest

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '_source/**'
      - '.github/workflows/vite-diagnose-latest.yml'

jobs:
  vite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct source
        shell: bash
        run: |
          set -euxo pipefail
          ls -1 _source/web.part*.b64
          test "$(ls -1 _source/web.part*.b64 | wc -l)" -eq 10
          cat _source/web.part00.b64 _source/web.part01.b64 _source/web.part02.b64 _source/web.part03.b64 _source/web.part04.b64 _source/web.part05.b64 _source/web.part06.b64 _source/web.part07.b64 _source/web.part08.b64 _source/web.part09.b64 | base64 -d > /tmp/almujtama-web.zip
          unzip -t /tmp/almujtama-web.zip
          rm -rf work && mkdir work
          unzip -q /tmp/almujtama-web.zip -d work
          test -f work/package.json
          test -f work/vite.config.ts
          test -f work/src/main.tsx
      - name: Install dependencies
        working-directory: work
        run: npm install --no-audit --no-fund
      - name: Vite build
        working-directory: work
        run: npm run build
      - name: Verify dist
        shell: bash
        run: |
          test -f work/dist/index.html
          find work/dist -maxdepth 3 -type f -print
