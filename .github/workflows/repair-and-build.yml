name: Repair Source and Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  repair-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Repair corrupted source chunks by expected SHA256
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          expected = {
              0: 'ddb35de299aa66b6c002800b858c90d4b7d0412781a742e3128cefa4329b9d7b',
              1: 'e2f1b2f4e1e396c248ee645fdee619e6ba3f79b6ad8e5e1abebfb00e453c6dc2',
              2: '6adb82b064b7fbfa1f69cb071577851d68a1e4fec7f289261c9d354688d5eea9',
              3: '1f178976aca1fbdce8355d5e1abc5b83c5806756955305339849248f5ca5d2e2',
              4: '3a2961863364eb470188c3f94404977b1a7ea9e33f2f3dce284d333b9f66e217',
              5: '8415c2b7aa1da81ab66b10bd4574ef61a55ae85762d22c9cc3f16bdfed842dca',
              6: '6968bce2851bf36bb7456f513df1fe9f54945e829054f8c4e8bbc676d021f9d0',
              7: '17e82a43da0daf9368b0be173e338b526cdc4f0972c75b2253f47493335be3ae',
              8: '83db49b00d99c6ef731743bd6e45a68d7719f632f7a8b6f0526ed75a019ef347',
              9: '27afc7114806ea70241cb2a347f2e95a0035fba8c9b3fcf3aed240778f5ca4f4',
          }
          alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/='

          def sha(s: str) -> str:
              return hashlib.sha256(s.encode('ascii')).hexdigest()

          def repair_one(path: Path, target: str, expected_len: int = 10000):
              s = path.read_text(encoding='ascii')
              if sha(s) == target:
                  return s
              if len(s) == expected_len - 1:
                  for i in range(len(s) + 1):
                      left, right = s[:i], s[i:]
                      for ch in alphabet:
                          cand = left + ch + right
                          if sha(cand) == target:
                              path.write_text(cand, encoding='ascii')
                              print(f'{path}: repaired missing char at position {i}: {ch!r}')
                              return cand
              if len(s) == expected_len:
                  for i, old in enumerate(s):
                      left, right = s[:i], s[i+1:]
                      for ch in alphabet:
                          if ch == old:
                              continue
                          cand = left + ch + right
                          if sha(cand) == target:
                              path.write_text(cand, encoding='ascii')
                              print(f'{path}: repaired substitution at position {i}: {old!r} -> {ch!r}')
                              return cand
              raise SystemExit(f'Unable to repair {path}; bytes={len(s)}, sha={sha(s)}, expected={target}')

          for n in range(10):
              p = Path(f'_source/web.part{n:02d}.b64')
              if not p.exists():
                  raise SystemExit(f'Missing source chunk: {p}')
              size = 8676 if n == 9 else 10000
              repair_one(p, expected[n], size)

          print('All 10 source chunks match their expected SHA256 hashes.')
          PY

      - name: Reconstruct and verify exact source ZIP
        shell: bash
        run: |
          set -euo pipefail
          cat _source/web.part00.b64 _source/web.part01.b64 _source/web.part02.b64 _source/web.part03.b64 _source/web.part04.b64 _source/web.part05.b64 _source/web.part06.b64 _source/web.part07.b64 _source/web.part08.b64 _source/web.part09.b64 | base64 -d > /tmp/almujtama-web.zip
          echo '2c24027cfb83fe6b1a00949e468b4e7b52787de244f21e73b2e7ec1f82e7e43a  /tmp/almujtama-web.zip' | sha256sum -c -
          unzip -t /tmp/almujtama-web.zip
          rm -rf work
          mkdir work
          unzip -q /tmp/almujtama-web.zip -d work
          test -f work/package.json
          test -f work/vite.config.ts
          test -f work/src/main.tsx
          echo 'Source ZIP is byte-for-byte verified.'

      - name: Install dependencies including Rollup native package
        working-directory: work
        run: npm install --no-audit --no-fund

      - name: Vite build
        working-directory: work
        run: npm run build

      - name: Verify Vite output
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          find dist -maxdepth 3 -type f -print
          echo 'VITE_BUILD_SUCCESS'
