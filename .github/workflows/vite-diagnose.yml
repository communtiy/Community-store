name: Vite Diagnose

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '_source/**'
      - '.github/workflows/vite-diagnose.yml'
      - '_patches/**'

jobs:
  vite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Reconstruct project source
        shell: bash
        run: |
          set -euxo pipefail
          cat _source/web.part*.b64 | base64 -d > /tmp/almujtama-web.zip
          rm -rf work
          mkdir -p work
          unzip -q /tmp/almujtama-web.zip -d work
          test -f work/package.json
          test -f work/vite.config.ts
          test -f work/src/main.tsx
          echo 'Source reconstruction OK'

      - name: Install dependencies
        working-directory: work
        run: npm install --no-audit --no-fund

      - name: Vite build
        working-directory: work
        run: npm run build

      - name: Show dist
        if: success()
        shell: bash
        run: find work/dist -maxdepth 3 -type f -print
